version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: team_task_manager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/team_task_manager?schema=public
      - JWT_ACCESS_SECRET=at-least-32-characters-long-secret-key-for-access-token
      - JWT_REFRESH_SECRET=at-least-32-characters-long-secret-key-for-refresh-token
      - CLIENT_URL=http://localhost:3000
      - PORT=4000
    depends_on:
      - db

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:4000/api
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api
      - PORT=3000
    depends_on:
      - api

volumes:
  postgres_data:
